name: Tägliche Pilzprognose

on:
  schedule:
    # UFZ aktualisiert gegen 10:10 UTC, DWD-Bodenfeuchte gegen 12:40 UTC; Prognose fuer morgen danach rechnen
    - cron: '0 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', 'data/arten.json', 'data/modell.json', 'data/static/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bodenfeuchte (UFZ-Dürremonitor)
        run: python scripts/fetch_ufz.py
      - name: Wetter (Open-Meteo)
        run: python scripts/fetch_weather.py
      - name: Bodenfeuchte (DWD, Kiefer 0–30 cm)
        run: python scripts/fetch_dwd.py || echo "DWD nicht erreichbar - UFZ als Rückfall"
      - name: Prognose für morgen berechnen
        run: python scripts/build_daily.py
      - name: Aktuelle Fundmeldungen (iNaturalist)
        run: python scripts/fetch_recent.py || echo "iNaturalist nicht erreichbar - ohne Fundmeldungen weiter"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
